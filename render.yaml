services:
  - type: web
    name: civiceye-smart-city
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: civiceye-admin
      - key: ADMIN_PASSWORD
        sync: false
